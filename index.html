<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad games</title>
    <link rel="stylesheet" type="text/css" href="game.css">
</head>
<body class="center">
<div class="fstdiv">
    <h1>Tic Tac Toe</h1>
</div>     
   

<div class="btndiv" id="main">

<button class="button" onclick="start()">Start the Game</button>
<br><br>
<button class="button" onclick="learn()">Learn how to play a game</button>
<br><br>
<button class="button" onclick="exit()">Exit</button>

</div>
<div class="learning" id="learn">
   
    <p>
        Player 1 is X & Player 2 is O
        <br>
        The player to get 3 marks in a row is the winner .If both are failed to do 3 in a row the Game will be tied.
    </p>
    <br>
    <br>
    <button onclick="main()" class="button1">Back</button>
     
</div>
<div class="gamesss" id="tictac">
    
        <div id="board">
            <div class="square" id="square0"></div>
            <div class="square" id="square1"></div>
            <div class="square" id="square2"></div>
            <div class="square" id="square3"></div>
            <div class="square" id="square4"></div>
            <div class="square" id="square5"></div>
            <div class="square" id="square6"></div>
            <div class="square" id="square7"></div>
            <div class="square" id="square8"></div>
        </div>
<br>
<br>
<button onclick="main();restartButton()" class="button1">Back</button>
<div id="endGame" class="btn1"></div>
    <input type="button" value="Restart" class="button1" id="restartButton" onclick="restartButton()"/>
</div>
    
  </div>
  
  
 
  <script src="game.js"></script>

</body>
</html>
